# Run ./setup.sh (macOS/Linux) or setup.cmd (Windows) first: it writes .env
# and picks the Ollama profile. After that, `docker compose up -d` works alone.

# Shared by the containerized Ollama variants below. Only one runs at a time,
# chosen by COMPOSE_PROFILES in .env. Ollama publishes no ports: only
# Open WebUI reaches it, over the private compose network.
x-ollama: &ollama
  image: ollama/ollama:${OLLAMA_TAG:-latest}
  container_name: ollama
  restart: always
  environment:
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-}
    OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
    # Set only when .env picks a folder on this computer for models.
    OLLAMA_MODELS: ${OLLAMA_MODELS:+/models}
  volumes:
    - ollama-models:/root/.ollama
    # OLLAMA_MODELS folder from .env. Without one, this mounts the volume
    # above a second time and goes unused.
    - ${OLLAMA_MODELS:-ollama-models}:/models
  networks:
    default:
      aliases: [ollama]

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: open-webui
    restart: always
    ports:
      - "${OPEN_WEBUI_BIND:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run setup, or set WEBUI_SECRET_KEY in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # false: settings below are re-applied from .env on every start, and
      # changes made in the Admin Panel last only until the next restart.
      ENABLE_PERSISTENT_CONFIG: ${ENABLE_PERSISTENT_CONFIG:-false}
      # Multi-user privacy: the admin can't read or export other users' chats.
      ENABLE_ADMIN_CHAT_ACCESS: ${ENABLE_ADMIN_CHAT_ACCESS:-false}
      ENABLE_ADMIN_EXPORT: ${ENABLE_ADMIN_EXPORT:-false}
      # Only the first account (the admin) can sign up; the admin adds everyone else.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-pending}
      ENABLE_COMMUNITY_SHARING: ${ENABLE_COMMUNITY_SHARING:-false}
      # Optional cloud models (OpenAI-compatible). Off unless configured.
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-false}
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      # Web search, on by default (DuckDuckGo needs no key).
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-duckduckgo}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_RESULT_COUNT: ${WEB_SEARCH_RESULT_COUNT:-5}
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: ${BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL:-false}
      # Prompt wrapped around legacy-mode search results and documents. Unlike Open WebUI's
      # default, it gives the model today's date and tells it to trust the
      # sources over its training data, which ends months before the model
      # is released. {{CURRENT_DATE}} and {{CONTEXT}} are filled per chat.
      # Default system prompt for every model (a model's own system prompt in
      # the Admin Panel replaces it). Open WebUI's default "native" tool calling
      # leaves web search to the model, which skips it when it thinks it knows
      # the answer, and rewrites unfamiliar names into ones it knows ("T3 Code"
      # became "T3 Stack"). With this prompt qwen3:30b searched 4 of 4 times,
      # for the name as written; without it, 1 of 4.
      DEFAULT_MODEL_PARAMS: '{"system": "Today is {{CURRENT_DATE}}. Your training data ends well before today, so it is out of date. When the search_web tool is available, call it before answering any question that mentions a product, project, tool, service, company, person, version or event, even if you think you already know the answer. Search for names exactly as the user wrote them: an unfamiliar name is most likely something newer than your training data, so never swap it for a similar name you know. If the search snippets are not enough, read the most relevant pages with fetch_url. Base your answer on what you found, and answer the question directly without commenting on the name or on these instructions."}'
      # Prompt that turns the chat into web search queries. Used when a model's
      # function calling is set to "legacy" (Admin Panel > Advanced Params);
      # in the default native mode the model writes its own queries. Open WebUI's default
      # asks for "broad" queries, so the model swaps names it doesn't know (a
      # new product) for ones it does, and searches for the wrong thing.
      QUERY_GENERATION_PROMPT_TEMPLATE: |
        ### Task:
        Write web search queries for the user's latest message, using the chat history for context. Generate 1-3 queries unless it is certain that no search is needed; then return an empty list. Today's date is {{CURRENT_DATE}}.

        ### Guidelines:
        - Keep names of products, projects, companies, people, versions and model numbers exactly as the user wrote them, including spelling and capitalisation.
        - Never replace a name you don't recognise with one you do. Unfamiliar names are probably newer than your training data; search for them as written.
        - Make the first query stay close to the user's own wording. Further queries may rephrase or add context, but must keep the same names.
        - Prefer specific queries over broad ones. Add the year only when the user asks about recent or current information.
        - Respond with a JSON object only, with no other text: { "queries": ["query1", "query2"] }. If no search is needed: { "queries": [] }.

        ### Chat History:
        <chat_history>
        {{MESSAGES:END:6}}
        </chat_history>
      RAG_TEMPLATE: |
        ### Task:
        Answer the user's query using the context below, which was retrieved for this query (web search results or the user's documents). Today's date is {{CURRENT_DATE}}.

        ### Guidelines:
        - Your training data ends well before today. The context is newer than your training, so prefer it over what you remember.
        - If the context mentions something you have never heard of (a new product, release, version or event), treat it as real and recent. Don't tell the user they are mistaken because you don't recognise it.
        - If the context and your own knowledge disagree, say so and go with the context, unless it is clearly unreliable.
        - If the context doesn't contain the answer, say that plainly, then answer from your own knowledge and say it may be out of date.
        - Never invent facts, names, numbers, links or quotes.
        - Cite sources inline as [id] (e.g. [1]) only when the <source> tag has an id attribute. Don't use XML tags in your answer.
        - Respond in the same language as the user's query.

        <context>
        {{CONTEXT}}
        </context>
    volumes:
      - open-webui-data:/app/backend/data

  ollama-cpu:
    <<: *ollama
    profiles: [ollama-cpu]

  ollama-nvidia:
    <<: *ollama
    profiles: [ollama-nvidia]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-amd:
    <<: *ollama
    image: ollama/ollama:rocm
    profiles: [ollama-amd]
    devices:
      - /dev/kfd
      - /dev/dri

volumes:
  open-webui-data:
    name: ${OPEN_WEBUI_VOLUME:-open-webui}
  ollama-models:
    name: ${OLLAMA_VOLUME:-ollama}
