# Run ./setup.sh (macOS/Linux) or setup.cmd (Windows) first: it writes .env
# and picks the Ollama profile. After that, `docker compose up -d` works alone.

# Shared by the containerized Ollama variants below. Only one runs at a time,
# chosen by COMPOSE_PROFILES in .env. Ollama publishes no ports: only
# Open WebUI reaches it, over the private compose network.
x-ollama: &ollama
  image: ollama/ollama:${OLLAMA_TAG:-latest}
  container_name: ollama
  restart: always
  environment:
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-}
    OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
    # Set only when .env picks a folder on this computer for models.
    OLLAMA_MODELS: ${OLLAMA_MODELS:+/models}
  volumes:
    - ollama-models:/root/.ollama
    # OLLAMA_MODELS folder from .env. Without one, this mounts the volume
    # above a second time and goes unused.
    - ${OLLAMA_MODELS:-ollama-models}:/models
  networks:
    default:
      aliases: [ollama]

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: open-webui
    restart: always
    ports:
      - "${OPEN_WEBUI_BIND:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run setup, or set WEBUI_SECRET_KEY in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # false: settings below are re-applied from .env on every start, and
      # changes made in the Admin Panel last only until the next restart.
      ENABLE_PERSISTENT_CONFIG: ${ENABLE_PERSISTENT_CONFIG:-false}
      # Multi-user privacy: the admin can't read or export other users' chats.
      ENABLE_ADMIN_CHAT_ACCESS: ${ENABLE_ADMIN_CHAT_ACCESS:-false}
      ENABLE_ADMIN_EXPORT: ${ENABLE_ADMIN_EXPORT:-false}
      # Only the first account (the admin) can sign up; the admin adds everyone else.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-pending}
      ENABLE_COMMUNITY_SHARING: ${ENABLE_COMMUNITY_SHARING:-false}
      # Optional cloud models (OpenAI-compatible). Off unless configured.
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-false}
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      # Optional web search. Off unless configured.
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - open-webui-data:/app/backend/data

  ollama-cpu:
    <<: *ollama
    profiles: [ollama-cpu]

  ollama-nvidia:
    <<: *ollama
    profiles: [ollama-nvidia]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-amd:
    <<: *ollama
    image: ollama/ollama:rocm
    profiles: [ollama-amd]
    devices:
      - /dev/kfd
      - /dev/dri

volumes:
  open-webui-data:
    name: ${OPEN_WEBUI_VOLUME:-open-webui}
  ollama-models:
    name: ${OLLAMA_VOLUME:-ollama}
